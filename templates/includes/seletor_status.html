{% load financeiro %}
<select
    class="seletor-status {{ objeto.status|status_classe }}"
    data-url="{{ url }}"
    data-status-atual="{{ objeto.status }}"
    data-permite-cartao="{% if permite_cartao %}1{% else %}0{% endif %}"
    data-valor="{{ valor }}"
    data-aberto="{% if objeto.status == 'aberto' %}1{% else %}0{% endif %}"
    aria-label="Status"
>
    {% for codigo, rotulo in opcoes %}
        <option value="{{ codigo }}" {% if objeto.status == codigo %}selected{% endif %}>{{ rotulo }}</option>
    {% endfor %}
</select>
