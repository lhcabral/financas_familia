{% if form.non_field_errors %}
    <div class="alerta alerta-error">{{ form.non_field_errors }}</div>
{% endif %}
{% for campo in form %}
    <div class="campo{% if campo.name == 'recorrente' %} campo-check{% endif %}">
        <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% if campo.help_text %}<p class="ajuda">{{ campo.help_text }}</p>{% endif %}
        {{ campo.errors }}
    </div>
{% endfor %}
{% if extra_template %}
    {% include extra_template %}
{% endif %}
