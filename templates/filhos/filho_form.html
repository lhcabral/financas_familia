{% extends "base.html" %}

{% block title %}Novo filho{% endblock %}
{% block kicker %}Filhos{% endblock %}
{% block heading %}Novo filho{% endblock %}

{% block content %}
<section class="card formulario">
    <form method="post">
        {% csrf_token %}
        {% for campo in form %}
            <div class="campo">
                <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
                {{ campo }}
                {{ campo.errors }}
            </div>
        {% endfor %}
        <div class="acoes">
            <button class="botao" type="submit">Salvar</button>
            <a class="botao-secundario" href="{% url 'filhos:lista' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
